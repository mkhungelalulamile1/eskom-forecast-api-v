# dev shares MAZ-KV-SAN-DTI-NONPROD01 with other nonprod workloads on this
# cluster -- secret *names* are env-suffixed
# (coalstockpile-sql-username-dev / -password-dev) so they don't collide
# with anything else already in that vault.
#
# clientID: same UAMI as patch-serviceaccount.yaml -- id-coalstockpile-dev,
# created and federated (confirmed live). Its "Key Vault Secrets User" role
# assignment on MAZ-KV-SAN-DTI-NONPROD01 is still outstanding (see
# docs/RUNBOOK.md for who needs to grant it and the exact command) -- until
# that's done, the pod will fail to mount with a Key Vault auth error, not
# the "provider not set"/"SecretProviderClass not found" errors seen before
# this file had a real clientID.
#
# tenantId: 93aedbdc-cc67-4652-aa12-d250a876ae79 -- confirmed via `az login`
# (see docs/RUNBOOK.md).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coalstockpile-kv-secrets
spec:
  parameters:
    clientID: "75399a2c-0c4b-4b55-a568-89763fb6d6eb"
    keyvaultName: MAZ-KV-SAN-DTI-NONPROD01
    tenantId: 93aedbdc-cc67-4652-aa12-d250a876ae79
    objects: |
      array:
        - |
          objectName: coalstockpile-sql-username-dev
          objectType: secret
        - |
          objectName: coalstockpile-sql-password-dev
          objectType: secret
  secretObjects:
    - secretName: coalstockpile-secrets
      type: Opaque
      data:
        - objectName: coalstockpile-sql-username-dev
          key: SQL_USERNAME
        - objectName: coalstockpile-sql-password-dev
          key: SQL_PASSWORD
