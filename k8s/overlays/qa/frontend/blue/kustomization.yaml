apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/frontend/color
nameSuffix: "-blue"
labels:
  - pairs:
      color: blue
    includeSelectors: true
images:
  - name: PLACEHOLDER_ACR_NAME.azurecr.io/coalstockpilefrontend
    newName: PLACEHOLDER_ACR_NAME.azurecr.io/coalstockpilefrontend
    newTag: PLACEHOLDER_TAG
