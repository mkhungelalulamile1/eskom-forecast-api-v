# prod gets its own Key Vault (not shared with dev/qa's nonprod vault) --
# entirely placeholder until it's provisioned. Secret object names aren't
# env-suffixed here since prod's vault won't hold any other environment's
# secrets, but kept as -prod for consistency with dev/-dev and qa/-qa.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coalstockpile-kv-secrets
spec:
  parameters:
    clientID: "PLACEHOLDER_UAMI_CLIENT_ID_PROD"
    keyvaultName: PLACEHOLDER_KEYVAULT_NAME_PROD
    tenantId: 93aedbdc-cc67-4652-aa12-d250a876ae79
    objects: |
      array:
        - |
          objectName: coalstockpile-sql-username-prod
          objectType: secret
        - |
          objectName: coalstockpile-sql-password-prod
          objectType: secret
  secretObjects:
    - secretName: coalstockpile-secrets
      type: Opaque
      data:
        - objectName: coalstockpile-sql-username-prod
          key: SQL_USERNAME
        - objectName: coalstockpile-sql-password-prod
          key: SQL_PASSWORD
