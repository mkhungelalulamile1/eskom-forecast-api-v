# Applies to both colors (podSelector matches on `app` only, not `color`).
# Same rule as base/frontend/single/networkpolicy.yaml -- see that file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coalstockpilefrontend-allow-8080
spec:
  podSelector:
    matchLabels:
      app: coalstockpilefrontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
      ports:
        - protocol: TCP
          port: 8080
