# Applies to both colors (podSelector matches on `app` only, not `color`).
# Same rule as base/backend/single/networkpolicy.yaml -- see that file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eskom-forecast-api-allow-8000
spec:
  podSelector:
    matchLabels:
      app: eskom-forecast-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
      ports:
        - protocol: TCP
          port: 8000
