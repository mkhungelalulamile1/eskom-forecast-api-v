# Azure AD Workload Identity ServiceAccount for the backend pod. The annotated
# client-id ties this SA to a User-Assigned Managed Identity federated with
# this AKS cluster's OIDC issuer for the subject
# system:serviceaccount:<namespace>:eskom-forecast-sa, holding both
# "Storage Blob Data Contributor" (Blob access) and, from Phase 2 onward,
# "Key Vault Secrets User" (Key Vault access) on the resources this
# environment uses. See docs/aks-workload-identity-storage.md.
#
# Real value patched per overlay (overlays/<env>/backend/patch-serviceaccount.yaml)
# -- placeholder here is never deployed as-is.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eskom-forecast-sa
  annotations:
    azure.workload.identity/client-id: "PLACEHOLDER_UAMI_CLIENT_ID"
