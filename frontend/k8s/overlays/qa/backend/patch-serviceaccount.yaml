# qa needs its OWN UAMI (not dev's) -- the federated credential's --subject
# includes the namespace (system:serviceaccount:app-coal-stockpile-qa:eskom-forecast-sa),
# so it can't be the same identity as dev's, even though both share the same
# AKS cluster/Key Vault. See docs/RUNBOOK.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eskom-forecast-sa
  annotations:
    azure.workload.identity/client-id: "19274d54-b8f0-4700-9dae-6c1c07dde191"
