# qa shares MAZ-KV-SAN-DTI-NONPROD01 with dev (and with other nonprod
# workloads on this cluster) -- secret *names* are env-suffixed
# (coalstockpile-sql-username-qa / -password-qa) so they don't collide with
# dev's or anything else's secrets in the same vault.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coalstockpile-kv-secrets
spec:
  parameters:
    clientID: "19274d54-b8f0-4700-9dae-6c1c07dde191"
    keyvaultName: MAZ-KV-SAN-DTI-NONPROD01
    tenantId: 93aedbdc-cc67-4652-aa12-d250a876ae79
    objects: |
      array:
        - |
          objectName: coalstockpile-sql-username-qa
          objectType: secret
        - |
          objectName: coalstockpile-sql-password-qa
          objectType: secret
  secretObjects:
    - secretName: coalstockpile-secrets
      type: Opaque
      data:
        - objectName: coalstockpile-sql-username-qa
          key: SQL_USERNAME
        - objectName: coalstockpile-sql-password-qa
          key: SQL_PASSWORD
