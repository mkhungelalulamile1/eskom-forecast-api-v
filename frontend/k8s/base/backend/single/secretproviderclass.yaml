# Mounts SQL_USERNAME/SQL_PASSWORD from Key Vault and syncs them into a
# native Secret (coalstockpile-secrets) for envFrom consumption -- replaces
# the hand-authored dummy-value Secret from before the AKS deployment
# overhaul. Real clientID/keyvaultName/tenantId/object names are all
# environment-specific placeholders here, patched per overlay
# (overlays/<env>/backend/patch-secretproviderclass.yaml) -- see
# docs/RUNBOOK.md.
#
# Uses the SAME UAMI as serviceaccount.yaml's Workload Identity (already
# granted "Storage Blob Data Contributor" for Blob access) -- extended with a
# "Key Vault Secrets User" role assignment on the target vault, rather than
# provisioning a second identity for one pod.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coalstockpile-kv-secrets
spec:
  # Required by the Secrets Store CSI Driver to know which provider plugin
  # to invoke -- without it, the driver can't interpret `parameters` below
  # at all and fails the volume mount with "provider not set" (confirmed
  # live: exactly this error on a real pod, no CSI-driver-level default).
  provider: azure
  parameters:
    clientID: PLACEHOLDER_UAMI_CLIENT_ID
    keyvaultName: PLACEHOLDER_KEYVAULT_NAME
    tenantId: PLACEHOLDER_TENANT_ID
    objects: |
      array:
        - |
          objectName: PLACEHOLDER_SQL_USERNAME_SECRET_NAME
          objectType: secret
        - |
          objectName: PLACEHOLDER_SQL_PASSWORD_SECRET_NAME
          objectType: secret
  # Full replacement, not a merge (SecretProviderClass is a CRD kustomize has
  # no schema for, so list fields like this one replace wholesale on patch)
  # -- must stay in sync with `objects:` above.
  secretObjects:
    - secretName: coalstockpile-secrets
      type: Opaque
      data:
        - objectName: PLACEHOLDER_SQL_USERNAME_SECRET_NAME
          key: SQL_USERNAME
        - objectName: PLACEHOLDER_SQL_PASSWORD_SECRET_NAME
          key: SQL_PASSWORD
