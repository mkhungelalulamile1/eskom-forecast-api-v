# prod needs its own UAMI, federated to prod's own AKS cluster's OIDC issuer
# once it exists -- can't reuse dev/qa's identity or cluster. See docs/RUNBOOK.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eskom-forecast-sa
  annotations:
    azure.workload.identity/client-id: "PLACEHOLDER_UAMI_CLIENT_ID_PROD"
