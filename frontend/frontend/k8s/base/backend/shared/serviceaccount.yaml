# Shared by both colors -- one Workload Identity per environment, not per
# color (see docs/aks-workload-identity-storage.md). Real client-id patched
# per overlay (overlays/<env>/backend/patch-serviceaccount.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eskom-forecast-sa
  annotations:
    azure.workload.identity/client-id: "PLACEHOLDER_UAMI_CLIENT_ID"
