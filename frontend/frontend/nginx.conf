# nginx site config for the Eskom Forecaster dashboard.
#
# Two responsibilities:
#   1. Serve the static single-page dashboard (index.html).
#   2. Reverse-proxy every /api/* request to the backend forecast service.
#
# The backend runs in the SAME Kubernetes namespace (app-coal-stockpile) and is
# exposed by the Service named `eskom-forecast-api` on port 80 (see
# k8s/data_backend-aks.yaml). In-cluster DNS resolves that Service at
# eskom-forecast-api.app-coal-stockpile.svc.cluster.local, so the browser only
# ever talks to this nginx (same origin) and never needs the backend URL.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable defaults for a static dashboard.
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Lightweight liveness/readiness endpoint for the frontend pod itself.
    # Handled entirely by nginx so probes don't touch the backend.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API reverse proxy.
    #
    # The backend Service name is resolved at REQUEST time, not at startup. This
    # is deliberate and matters in Kubernetes:
    #   * A static `upstream {}` / literal host makes nginx resolve the name when
    #     the config loads -- so `nginx -t` and pod startup both FAIL with
    #     "host not found in upstream" if cluster DNS / the backend Service isn't
    #     available at that instant (e.g. during `docker build`, or if the
    #     frontend rolls out before the backend). That is exactly the build error
    #     we hit.
    #   * Putting the host in a $variable defers resolution to each request, using
    #     the `resolver` injected into conf.d/resolver.conf by
    #     /docker-entrypoint.d/10-resolver.sh. The pod then starts cleanly, a
    #     missing backend yields a 502 (not a crash-loop), and we always track the
    #     Service's current ClusterIP.
    #
    # The backend's own routes are already prefixed with /api/ (e.g.
    # GET /api/forecast-data), so we forward the original request URI unchanged
    # via $request_uri -- no path rewrite.
    location /api/ {
        set $forecast_backend "eskom-forecast-api.app-coal-stockpile.svc.cluster.local";
        proxy_pass http://$forecast_backend:80$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Some API calls (ingest / run-forecast) can be slow -- give them room.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Static hosting: serve the file if it exists, otherwise fall back to the
    # dashboard so client-side navigation keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
